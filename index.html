    <script>
        // Logika Slider Carousel
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        const slideIndexDisplay = document.getElementById('slide-index');

        function showSlide(index) {
            if (index >= slides.length) currentSlide = 0;
            else if (index < 0) currentSlide = slides.length - 1;
            else currentSlide = index;

            slides.forEach((slide, i) => {
                slide.classList.remove('active');
                if (i === currentSlide) slide.classList.add('active');
            });

            slideIndexDisplay.textContent = `${currentSlide + 1} / ${slides.length}`;
        }

        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }

        // Fungsi langsung lompat ke slide tertentu berdasarkan urutan array (dimulai dari angka 0)
        function goToSlide(slideNum) {
            showSlide(slideNum);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') changeSlide(-1);
            if (event.key === 'ArrowRight') changeSlide(1);
        });

        // Logika Hamburger Menu (HP)
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleMobileMenu);
    </script>
