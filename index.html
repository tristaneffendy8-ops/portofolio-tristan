<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        html, body { min-height: 100vh; margin: 0; background-color: #d28684; }
        body { font-family: 'Inter', sans-serif; }
        .carousel-slide { display: none; }
        .carousel-slide.active { display: block; }
    </style>
</head>
<body class="bg-[#d28684] text-[#4a2e2d] min-h-screen flex flex-col justify-center items-center selection:bg-[#f1cdca] p-4">

    <div class="w-full max-w-md md:max-w-5xl flex flex-col items-center">
        
        <header class="w-full text-center pb-4 md:pb-6">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-[#e9dc4d] drop-shadow-sm">
                My Portfolio
            </h1>
        </header>

        <main class="w-full">
            <div class="relative w-full rounded-2xl overflow-hidden shadow-xl border-4 border-[#ebd6d4] bg-[#f2dfdd] aspect-[4/3] md:aspect-[16/9]">
                
                <div class="carousel-slide active w-full h-full">
                    <img src="1.jpg" alt="Portfolio Cover" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="2.jpg" alt="About Me" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="3.jpg" alt="Education" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="4.jpg" alt="My Skill" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="5.jpg" alt="Experience" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="6.jpg" alt="Project 1" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="7.jpg" alt="Project 2" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="8.jpg" alt="Project 6 - Part 1" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="9.jpg" alt="Project 6 - Part 2" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="10.jpg" alt="Project 6 - Part 3" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="11.jpg" alt="Project 6 - Part 4" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="12.jpg" alt="Project 7" class="w-full h-full object-contain md:object-cover">
                </div>
                <div class="carousel-slide w-full h-full">
                    <img src="13.jpg" alt="Lets Work Together" class="w-full h-full object-contain md:object-cover">
                </div>

                <button onclick="changeSlide(-1)" class="absolute left-2 md:left-4 top-1/2 -translate-y-1/2 bg-[#4a2e2d]/60 hover:bg-[#4a2e2d]/80 text-[#f2dfdd] p-2 md:p-3 rounded-full transition-all border border-[#ebd6d4]/30 touch-manipulation">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 md:w-6 md:h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </button>
                <button onclick="changeSlide(1)" class="absolute right-2 md:right-4 top-1/2 -translate-y-1/2 bg-[#4a2e2d]/60 hover:bg-[#4a2e2d]/80 text-[#f2dfdd] p-2 md:p-3 rounded-full transition-all border border-[#ebd6d4]/30 touch-manipulation">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 md:w-6 md:h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </button>

                <div class="absolute bottom-3 right-3 bg-[#4a2e2d]/80 px-2.5 py-1 rounded-md text-xs font-semibold tracking-wider text-[#e9dc4d]" id="slide-index">
                    1 / 13
                </div>
            </div>
        </main>

    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        const slideIndexDisplay = document.getElementById('slide-index');

        function showSlide(index) {
            if (index >= slides.length) currentSlide = 0;
            else if (index < 0) currentSlide = slides.length - 1;
            else currentSlide = index;

            slides.forEach((slide, i) => {
                slide.classList.remove('active');
                if (i === currentSlide) slide.classList.add('active');
            });

            slideIndexDisplay.textContent = `${currentSlide + 1} / ${slides.length}`;
        }

        function changeSlide(direction) {
            showSlide(currentSlide + direction);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') changeSlide(-1);
            if (event.key === 'ArrowRight') changeSlide(1);
        });
    </script>

</body>
</html>
